name: check

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt
      - name: Compile every Python file
        run: find . -name '*.py' -not -path './node/node_modules/*' -not -path './.venv/*' -print0 | xargs -0 python -m py_compile

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: node
      - name: Syntax-check every .mjs file
        run: for f in node/*.mjs; do node --check "$f"; done

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n curl/chat.sh
